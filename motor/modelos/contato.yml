# Contato que aparece no topo do CV.
#
# Este arquivo mora em eu/cv/contato.yml e fica FORA do git (está no
# .gitignore). Telefone e email não entram no histórico, porque o que entra no
# histórico do git fica lá para sempre, mesmo depois de apagado do arquivo.
# Nenhum outro arquivo do kit repete estes valores.

email:
telefone:

# Cidade e estado. Pode ser texto simples ou ter as duas línguas, com as chaves
# pt e en.
local:

# Registro profissional com número (COREN, OAB, CRM, CREA), quando a pessoa
# quer que ele apareça no cabeçalho do CV. O conselho e a situação vão também
# no FATOS.yml, em certificacoes; o número fica só aqui.
registro:

# Data de nascimento (AAAA-MM-DD), só se a pessoa quiser que o /aplicar-vagas
# preencha os formulários que pedem. Mora aqui porque este arquivo fica fora do
# git. Vazio, a vaga que pedir a data é pulada.
nascimento:

# Cada link é um item com duas chaves: texto (o que aparece escrito no PDF,
# por exemplo o endereço sem o https) e url (o endereço completo).
links: []
