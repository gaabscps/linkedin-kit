telefone:

# Cidade e estado. Pode ser texto simples ou ter as duas línguas, com as chaves
# pt e en.
local:

# Cada link é um item com duas chaves: texto (o que aparece escrito no PDF,
# por exemplo o endereço sem o https) e url (o endereço completo).
links: []
